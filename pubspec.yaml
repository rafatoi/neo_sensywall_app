name: neo_sensywall_app
description: "Flutter migration of the Sensy Wall controller."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  audioplayers: 6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  intl: ^0.20.3
  lottie: ^3.6.1
  flutter_reactive_ble: 5.6.0
  permission_handler: 13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
    - assets/audio/
    - assets/launcher/
    - assets/assets_manifest.json
